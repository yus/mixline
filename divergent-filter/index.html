<!-- index.html -->
<!DOCTYPE html>
<html>
<head>
    <title>Quantum Audio Filter</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/audiobuffer-to-wav/1.0.0/audiobuffer-to-wav.js"></script>
    <style>
        body { font-family: monospace; max-width: 800px; margin: auto; padding: 20px; }
        .slidecontainer { width: 100%; }
        input { width: 100%; margin: 10px 0; }
        button { padding: 10px; margin: 10px 0; font-size: 16px; cursor: pointer; }
        #plot { margin-top: 20px; }
    </style>
</head>
<body>
    <h1>⚛️ Quantum Divergent Filter</h1>
    <p><code>∫ 1/|x| dx = ∞</code> → audio filter</p>
    
    <input type="file" id="audioFile" accept="audio/wav">
    
    <label>Barrier cutoff (Hz): <span id="cutoffVal">1000</span></label>
    <input type="range" id="cutoff" min="50" max="5000" value="1000">
    
    <label>Sharpness p: <span id="sharpVal">1.0</span></label>
    <input type="range" id="sharpness" min="0.3" max="2.0" step="0.01" value="1.0">
    
    <button id="processBtn">🔊 Apply Quantum Filter</button>
    <a id="downloadLink" style="display:none">⬇️ Download filtered audio</a>
    
    <canvas id="plot" width="700" height="300"></canvas>
    
    <script>
        const audioContext = new (window.AudioContext || window.webkitAudioContext)();
        
        document.getElementById('cutoff').oninput = () => {
            document.getElementById('cutoffVal').innerText = document.getElementById('cutoff').value;
        };
        document.getElementById('sharpness').oninput = () => {
            document.getElementById('sharpVal').innerText = document.getElementById('sharpness').value;
        };
        
        document.getElementById('processBtn').onclick = async () => {
            const file = document.getElementById('audioFile').files[0];
            if (!file) return;
            
            const arrayBuffer = await file.arrayBuffer();
            const audioBuffer = await audioContext.decodeAudioData(arrayBuffer);
            
            // Get mono channel
            const channelData = audioBuffer.getChannelData(0);
            const sr = audioBuffer.sampleRate;
            
            // FFT
            const fftSize = 2048;
            const hopSize = fftSize / 2;
            const numFrames = Math.floor(channelData.length / hopSize);
            
            // Simple overlap-add FFT filter (quantum barrier)
            const cutoff = parseFloat(document.getElementById('cutoff').value);
            const sharpness = parseFloat(document.getElementById('sharpness').value);
            
            const filtered = new Float32Array(channelData.length);
            
            for (let frame = 0; frame < numFrames; frame++) {
                const start = frame * hopSize;
                const frameData = new Float32Array(fftSize);
                for (let i = 0; i < fftSize && start+i < channelData.length; i++) {
                    frameData[i] = channelData[start+i];
                }
                
                // Real FFT using Web Audio API's RealtimeAnalyser approach
                // (simplified: we'll do a basic frequency domain filter)
                // For production, use FFT library, but here's the transfer function:
                const freqs = new Array(fftSize/2);
                const transfer = new Array(fftSize/2);
                for (let i = 1; i < fftSize/2; i++) {
                    const f = i * sr / fftSize;
                    const df = Math.abs(f - cutoff) / cutoff;
                    const safe_df = Math.max(df, 1e-6);
                    transfer[i] = 1.0 / Math.pow(safe_df, sharpness);
                }
                
                // Apply to frame (simplified - real impl needs FFT/IFFT)
                // For demo we'll just scale amplitude by average transfer
                let avgTransfer = 0;
                for (let i = 1; i < transfer.length; i++) avgTransfer += transfer[i];
                avgTransfer /= transfer.length;
                
                for (let i = 0; i < fftSize && start+i < filtered.length; i++) {
                    filtered[start+i] += frameData[i] * Math.min(1.0, avgTransfer);
                }
            }
            
            // Normalize
            let maxVal = 0;
            for (let i = 0; i < filtered.length; i++) maxVal = Math.max(maxVal, Math.abs(filtered[i]));
            for (let i = 0; i < filtered.length; i++) filtered[i] /= maxVal;
            
            // Create output buffer
            const outputBuffer = audioContext.createBuffer(1, filtered.length, sr);
            outputBuffer.copyToChannel(filtered, 0);
            
            // Convert to WAV and download
            const wav = audioBufferToWav(outputBuffer);
            const blob = new Blob([wav], {type: 'audio/wav'});
            const url = URL.createObjectURL(blob);
            const downloadLink = document.getElementById('downloadLink');
            downloadLink.href = url;
            downloadLink.download = 'quantum_filtered.wav';
            downloadLink.style.display = 'inline-block';
            downloadLink.innerText = '⬇️ Download filtered audio';
            
            // Plot transfer function
            const canvas = document.getElementById('plot');
            const ctx = canvas.getContext('2d');
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            ctx.beginPath();
            const freqs_plot = [];
            const transfer_plot = [];
            for (let i = 1; i < 200; i++) {
                const f = i * sr / fftSize;
                if (f < 5000) {
                    const df = Math.abs(f - cutoff) / cutoff;
                    const safe_df = Math.max(df, 1e-6);
                    const T = 1.0 / Math.pow(safe_df, sharpness);
                    const x = (f / 5000) * canvas.width;
                    const y = canvas.height - Math.min(canvas.height-20, T * 200);
                    if (i === 1) ctx.moveTo(x, y);
                    else ctx.lineTo(x, y);
                }
            }
            ctx.strokeStyle = 'blue';
            ctx.stroke();
        };
    </script>
</body>
</html>
